# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier


# pypr expose
# Setup the key binding
bind = $mainMod, B, exec, /home/select/.local/bin/pypr expose
# Add some style to the "exposed" workspace
workspace = special:exposed,gapsout:60,gapsin:30,bordersize:5,border:true,shadow:false

bind = $mainMod , Z, exec, /home/select/.local/bin/pypr zoom ++0.5
bind = $mainMod SHIFT, Z, exec, /home/select/.local/bin/pypr zoom

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, Q, killactive # Kill active window
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/wofi_power.sh
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod SHIFT, F, pin
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, space, exec, $menu
bind = $mainMod, F, exec, nix run nixpkgs#nwg-drawer
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/waybar.sh # Reload waybar
bind = $mainMod SHIFT, A, exec, ~/.config/hypr/scripts/toggle_animations.sh # Toggle animations
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh random # change the background image
bind = $mainMod SHIFT, E, exec, ~/.config/hypr/scripts/wofi-emoji # run emoji picker
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/mpv-float.sh # Resize mpv
bind = $mainMod SHIFT, J, exec, ~/.config/hypr/scripts/position-floating.sh t 
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/position-floating.sh r 
bind = $mainMod SHIFT, K, exec, ~/.config/hypr/scripts/position-floating.sh b 
bind = $mainMod SHIFT, H, exec, ~/.config/hypr/scripts/position-floating.sh l 
bind = $mainMod SHIFT, T, exec, ~/.local/bin/hyprshot -m window # screeshot full screen
bind = $mainMod SHIFT, R, exec, ~/.local/bin/hyprshot -m region # screeshot select region
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw
bind = $mainMod, Escape, exec, swaylock
bind = $mainMod ALT, BackSpace, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next
bind = $mainMod, V, exec, cliphist list | wofi -dmenu | cliphist decode | wl-copy

# Windows
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, T, togglefloating # Toggle active windows into floating mode
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, P, pin # Pin window to all desktops
bind = $mainMod, X, fullscreen # Set active window to fullscreen
bind = $mainMod CTRL, right, resizeactive, 100 0 # Increase window width with keyboard
bind = $mainMod CTRL, left, resizeactive, -100 0 # Reduce window width with keyboard
bind = $mainMod CTRL, down, resizeactive, 0 100 # Increase window height with keyboard
bind = $mainMod CTRL, up, resizeactive, 0 -100 # Reduce window height with keyboard


bind = $mainMod SHIFT, left, movewindow,l # Move window to the left
bind = $mainMod SHIFT, right,  movewindow,r # Move window to the right
bind = $mainMod SHIFT, up, movewindow,u # Move window to the up
bind = $mainMod SHIFT, down,  movewindow,d # Move window to the down


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod ALT, right, workspace, +1 # Open next workspace
bind = $mainMod ALT, left, workspace, -1 # Open previous workspace


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod SHIFT CTRL, right, movetoworkspace, +1
bind = $mainMod SHIFT CTRL, left, movetoworkspace, -1

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod SHIFT, mouse:273, resizewindow 1 # Resize respecting aspect ratio


# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10% # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%- # Reduce brightness by 10%
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.3 # Increase volume by 5%
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Reduce volume by 5%
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause # Audio pause
bind = , XF86AudioNext, exec, playerctl next # Audio next
bind = , XF86AudioPrev, exec, playerctl previous # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle # Toggle microphone
bind = , XF86Calculator, exec, ~/.config/ml4w/settings/calculator.sh # Open calculator
bind = , XF86Lock, exec, hyprlock # Open screenlock
bind = , XF86Tools, exec, alacritty --class dotfiles-floating -e ~/.config/ml4w/apps/ML4W_Dotfiles_Settings-x86_64.AppImage # Open ML4W Dotfiles Settings app

