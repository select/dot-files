# hyprlock - screen locker config
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor      = true
    ignore_empty_input = true
}

background {
    monitor = 
    # Current pywal wallpaper; change if you switch wallpapers manually.
    path    = /home/linux-falko/Pictures/Wallpaper/detailed wallpaper for mobile.png
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.6
}

# Clock
label {
    monitor   = 
    text      = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 110
    font_family = sans-serif
    color     = rgba(255, 255, 255, 0.95)
    position  = 0, 180
    halign    = center
    valign    = center
}

# Date
label {
    monitor   = 
    text      = cmd[update:60000] echo "$(date +'%A, %d %B')"
    font_size = 22
    font_family = sans-serif
    color     = rgba(255, 255, 255, 0.85)
    position  = 0, 80
    halign    = center
    valign    = center
}

# Password input
input-field {
    monitor      = 
    size         = 320, 55
    outline_thickness = 2
    dots_size    = 0.25
    dots_spacing = 0.3
    dots_center  = true
    outer_color  = rgba(219, 96, 27, 0.9)
    inner_color  = rgba(14, 10, 25, 0.7)
    font_color   = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    check_color  = rgba(243, 158, 33, 0.9)
    fail_color   = rgba(175, 65, 77, 0.9)
    fail_text    = <i>Wrong</i>
    position     = 0, -60
    halign       = center
    valign       = center
}
