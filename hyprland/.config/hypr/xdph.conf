screencopy {
    # Zoom (and some other apps) cannot consume DmaBuf buffers and show a black
    # screen on the 2nd+ screen-share. Forcing SHM buffers keeps them working.
    # Trade-off: SHM copies frames through the CPU (costs at high resolutions).
    # See: github.com/hyprwm/xdg-desktop-portal-hyprland/issues/172 and #178
    force_shm = true
    max_fps = 15
}
