# hypridle - Hyprland's native idle daemon
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd        = pidof hyprlock || ~/.config/hypr/scripts/lock.sh   # avoid spawning multiple locks
    before_sleep_cmd = loginctl lock-session       # lock before the system sleeps
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({"on"})'  # wake screens on resume
}

# Lock the screen after 30 minutes of inactivity.
listener {
    timeout    = 1800
    on-timeout = loginctl lock-session
}

# Turn the screens off shortly after locking.
# NOTE: table syntax is required - positional `dpms off` is broken under the lua parser.
listener {
    timeout    = 1805
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({"off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({"on"})'
}
