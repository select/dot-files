unbind C-b
set-option -g prefix C-l
bind-key C-l send-prefix

# pi coding agent requested this
set -g extended-keys-format csi-u

# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga terminal-overrides ',xterm-kitty:RGB'
set -g allow-passthrough on
set -g extended-keys on
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g monitor-activity on
set -g mouse on

# Use Alt-arrow keys without prefix to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Ctrl+Shift+Arrow
bind -n C-S-Left resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up resize-pane -U 5
bind -n C-S-Down resize-pane -D 5

bind -n C-X resize-pane -Z
bind -n S-Left previous-window
bind -n S-Right next-window

# Splits via Ctrl+l prefix (so Termux can't intercept)
bind -n F5 split-window -h
bind -n F6 split-window -v
bind -n F7 resize-pane -Z
bind c new-window
bind -n C-t new-window

# Navigate windows via Ctrl+l prefix
bind p previous-window
bind n next-window
bind l last-window

set -sg escape-time 0

bind r source-file ~/.config/tmux/tmux.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh mosh-client mosh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
source-file ~/.cache/wal/colors-tmux.conf
