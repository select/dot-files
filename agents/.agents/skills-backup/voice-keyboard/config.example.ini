[whisper]
# Model sizes (English-only, fastest to most accurate):
#   tiny.en   - ~75MB,  fastest, good for simple dictation
#   base.en   - ~150MB, balanced speed/accuracy
#   small.en  - ~500MB, better accuracy
#   medium.en - ~1.5GB, high accuracy
#   large-v3  - ~3GB,   best accuracy (needs >4GB VRAM)
# Or use a Hugging Face model ID (e.g., Systran/faster-distil-whisper-large-v3)
model = tiny.en

# Device: cpu or cuda
# cpu - Works on all systems, optimized for Intel/AMD processors
# cuda - NVIDIA GPU (requires cuDNN) or AMD GPU (requires ROCm)
device = cuda

# Compute type:
#   float16      - fastest on GPU, recommended for CUDA
#   int8         - lower memory, slightly slower (good for CPU)
#   int8_float16 - balanced
#   float32      - highest accuracy, most VRAM
compute_type = float16

[hotkey]
# Key to hold for recording: alt_gr, f12, scroll_lock, pause, etc.
# alt_gr is the Right Alt key (AltGr on international keyboards)
key = alt_gr

[behavior]
# Type text into active input field
auto_type = true

# Show desktop notification
notifications = true

# Grab keyboard exclusively to suppress hotkey from reaching other apps
# Requires /dev/uinput access (sudo modprobe uinput)
grab_keyboard = false
