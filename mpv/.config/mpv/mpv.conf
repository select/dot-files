# ── Renderer ───────────────────────────────────────────────────────────────
vo=gpu-next                     # modern libplacebo renderer
gpu-context=wayland             # Wayland-native (syncs to Hyprland's vsync)
gpu-api=opengl                  # well-tested on Intel Iris Xe

# ── Hardware decoding ──────────────────────────────────────────────────────
hwdec=vaapi                     # Intel Iris Xe VA-API decode
hwdec-codecs=all                # apply to all codecs, not just h264

# ── Video sync ─────────────────────────────────────────────────────────────
video-sync=display-resample     # lock video cadence to display vblank (resamples audio)
framedrop=vo                    # drop frames at vo level only (never decoder)

# ── Interpolation (smooths 24fps content on 60Hz display) ──────────────────
interpolation=yes               # enable temporal interpolation
tscale=oversample               # lightweight, low-latency interpolation method

# ── Scaling ────────────────────────────────────────────────────────────────
scale=lanczos                   # upscaling
dscale=lanczos                  # downscaling
cscale=lanczos                  # chroma upscaling
scale-antiring=0.7              # reduce ringing artifacts
dscale-antiring=0.7

# ── Color / HDR ────────────────────────────────────────────────────────────
target-colorspace-hint=yes      # pass HDR metadata to compositor if supported
tone-mapping=bt.2446a           # good HDR→SDR tone-mapping (libplacebo)

# ── Audio ──────────────────────────────────────────────────────────────────
audio-device=auto
volume=100
volume-max=150

# ── OSD / interface ────────────────────────────────────────────────────────
osc=yes
osd-bar=yes
osd-font-size=36

# ── Screenshot ─────────────────────────────────────────────────────────────
screenshot-format=png
screenshot-directory=~/Pictures
screenshot-template=mpv-%F-%P
