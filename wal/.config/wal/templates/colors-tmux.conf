# Tmux colors from pywal
# Using #1a1a1a to match the sequences template background

set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"

# Status bar
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-style "bg=#1a1a1a,fg={foreground}"

# Status left: [0] with flat left, arrow into inactive color
set-option -g status-left-length 50
set-option -g status-left "#[bg={color2},fg=#1a1a1a,bold] [#S] #[fg={color2},bg=#1a1a1a]#(printf '\ue0bc')"

# Status right: date section
set-option -g status-right-length 150
set-option -g status-right "#[fg=#1a1a1a,bg={color8}]#(printf '\ue0bc')#[bg={color8},fg=#1a1a1a] %Y-%m-%d  %H:%M "

# Inactive windows: visible trailing triangle caps into terminal background
set-window-option -g window-status-format "#[fg=#1a1a1a,bg={color8}]#(printf '\ue0bc')#[bg={color8},fg=#1a1a1a] #I:#W#F #[fg={color8},bg=#1a1a1a]#(printf '\ue0bc')"

# Active window: visible triangles, trailing cap into terminal background
set-window-option -g window-status-current-format "#[fg=#1a1a1a,bg={color3}]#(printf '\ue0bc')#[bg={color3},fg=#1a1a1a,bold] #I:#W#F #[fg={color3},bg=#1a1a1a]#(printf '\ue0bc')"

set-window-option -g window-status-activity-style "fg=#1a1a1a,bg={color1}"

# Window separator empty
set-window-option -g window-status-separator ""

# Pane borders
set-option -g pane-border-style "fg={color8}"
set-option -g pane-active-border-style "fg={color2}"

# Message text
set-option -g message-style "bg={color2},fg=#000000"
set-option -g message-command-style "bg={color1},fg=#000000"

set-option -g display-panes-active-colour "{color3}"
set-option -g display-panes-colour "{color8}"
set-window-option -g clock-mode-colour "{color2}"
set-option -g mode-style "bg={color2},fg=#000000"
